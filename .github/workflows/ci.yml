name: phase-tool-ci

on:
  push:
  pull_request:

jobs:
  posix-production:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Full test suite
        run: python -m pytest -W error -ra
      - name: Build wheel and sdist
        run: python -m build
      - name: Installed entrypoint smoke
        shell: bash
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install dist/*.whl
          .ci-venv/bin/phase --version
          .ci-venv/bin/phase doctor
          .ci-venv/bin/phase contracts list
