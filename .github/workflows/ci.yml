name: phase-tool-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  posix-production:
    name: posix-production (${{ matrix.python }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Capture exact candidate and Linux runtime
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE: ${{ runner.temp }}/phase-next-evidence
        run: |
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree} | tee "$EVIDENCE/git-identity.txt"
          python --version | tee "$EVIDENCE/python-version.txt"
          uname -a | tee "$EVIDENCE/kernel.txt"
          stat -f -c '%T' . "$RUNNER_TEMP" | tee "$EVIDENCE/filesystems.txt"
      - name: Bootstrap scope check
        if: github.head_ref == 'chore/private-bootstrap'
        run: python scripts/private_bootstrap_check.py | tee "$EVIDENCE/bootstrap-check.json"
      - name: Install test dependencies
        run: |
          python -m pip install ".[test]" 2>&1 | tee "$EVIDENCE/install-test-deps.log"
          python -m pip freeze > "$EVIDENCE/test-dependencies.txt"
      - name: Full test suite
        run: python -m pytest -W error -ra --junitxml="$EVIDENCE/pytest.xml" 2>&1 | tee "$EVIDENCE/pytest.log"
      - name: Build wheel and sdist
        run: |
          python -m build --outdir "$EVIDENCE/dist" 2>&1 | tee "$EVIDENCE/build.log"
          (cd "$EVIDENCE/dist" && sha256sum --binary ./*) > "$EVIDENCE/build-SHA256SUMS"
      - name: Installed entrypoint smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/phase-next-wheel-venv"
          VENV="$RUNNER_TEMP/phase-next-wheel-venv"
          "$VENV/bin/python" -m pip install "$EVIDENCE"/dist/*.whl 2>&1 | tee "$EVIDENCE/install-wheel.log"
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$VENV/bin/python" -c 'import importlib.metadata as m, pathlib, sys, phase_tool; p=pathlib.Path(phase_tool.__file__).resolve(); assert p.is_relative_to(pathlib.Path(sys.prefix).resolve()), p; assert m.version("phase-tool") == "1.1.0rc1"; print(p)' | tee "$EVIDENCE/installed-location.txt"
          "$VENV/bin/phase" --version | tee "$EVIDENCE/installed-version.txt"
          "$VENV/bin/phase" doctor | tee "$EVIDENCE/installed-doctor.json"
          "$VENV/bin/phase" contracts list | tee "$EVIDENCE/installed-contracts.json"
          "$VENV/bin/python" -m pip freeze > "$EVIDENCE/installed-dependencies.txt"
      - name: Installed publish-file CLI/MCP smoke
        run: |
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/phase-next-wheel-venv/bin/python" "$GITHUB_WORKSPACE/scripts/f01_installed_smoke.py" --root "$EVIDENCE/installed-f01" 2>&1 | tee "$EVIDENCE/installed-f01.log"
      - name: Installed RC01 file bundle status recovery smoke
        run: |
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/phase-next-wheel-venv/bin/python" "$GITHUB_WORKSPACE/scripts/rc01_installed_smoke.py" --root "$EVIDENCE/installed-rc01" 2>&1 | tee "$EVIDENCE/installed-rc01.log"
      - name: Preserve private verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-next-${{ github.event.pull_request.head.sha || github.sha }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/phase-next-evidence/
          # This isolated test-evidence root contains the required .phase bundles.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  publication-resources:
    name: publication-resources (installed py3.11 wheel)
    needs: posix-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: phase-next-${{ github.event.pull_request.head.sha || github.sha }}-py3.11
          path: ${{ runner.temp }}/phase-resource-candidate
      - name: Install exact tested candidate wheel
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/phase-resource-evidence"
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/git-identity.txt"
          diff "$EVIDENCE/git-identity.txt" "$RUNNER_TEMP/phase-resource-candidate/git-identity.txt"
          python -m venv "$RUNNER_TEMP/phase-resource-venv"
          PYTHON="$RUNNER_TEMP/phase-resource-venv/bin/python"
          printf 'RESOURCE_PYTHON=%s\n' "$PYTHON" >> "$GITHUB_ENV"
          "$PYTHON" -m pip install "$RUNNER_TEMP"/phase-resource-candidate/dist/*.whl
          (cd "$RUNNER_TEMP/phase-resource-candidate/dist" && sha256sum --binary ./*) > "$EVIDENCE/build-SHA256SUMS"
          diff "$EVIDENCE/build-SHA256SUMS" "$RUNNER_TEMP/phase-resource-candidate/build-SHA256SUMS"
          "$PYTHON" -m pip freeze > "$EVIDENCE/installed-dependencies.txt"
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$PYTHON" -c 'import importlib.metadata as m, pathlib, sys, phase_tool; p=pathlib.Path(phase_tool.__file__).resolve(); assert p.is_relative_to(pathlib.Path(sys.prefix).resolve()); assert m.version("phase-tool") == "1.1.0rc1"; print(p)' > "$EVIDENCE/installed-location.txt"
      - name: Real 64 MiB 1 GiB 2 GiB streaming and RSS gate
        run: |
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RESOURCE_PYTHON" "$GITHUB_WORKSPACE/scripts/rc01_resources.py" --output "$EVIDENCE/resources.json" 2>&1 | tee "$EVIDENCE/resources.log"
      - name: Real 256 file 256 MiB bundle gate
        run: |
          unset PYTHONPATH
          cd "$RUNNER_TEMP"
          "$RESOURCE_PYTHON" "$GITHUB_WORKSPACE/scripts/rc01_bundle_resources.py" --output "$EVIDENCE/bundle-resources.json" 2>&1 | tee "$EVIDENCE/bundle-resources.log"
      - name: Preserve exact-candidate resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-resources-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase-resource-evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
