[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-tool"
version = "1.0.0"
description = "Universal local Phase Tool with CLI and MCP interfaces"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Phase Tool Contributors"}]
keywords = ["phase", "mcp", "validation", "provenance", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "referencing>=0.30,<1",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<9",
]

[project.scripts]
phase = "phase_tool.cli.main:main"
phase-mcp = "phase_tool.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phase_tool = ["data/**/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
